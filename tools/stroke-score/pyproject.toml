[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-score"
version = "0.1.0"
description = "Rank Herculaneum-scroll segments by stroke-like ink on the reading side versus the blind side of the same sheet"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless", "tifffile", "zarr"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
stroke-score = "stroke_score.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
