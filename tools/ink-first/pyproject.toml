[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ink-first"
version = "0.1.0"
description = "Look for ink in Herculaneum-scroll CT without a mesh: patches along the local sheet normal of a surface prediction, inked by any 66-layer model and mapped back to 3D"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "opencv-python-headless", "tifffile", "zarr>=3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ink-first = "ink_first.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
